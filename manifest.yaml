description: >-
  把真人出镜的竖屏口播原片做成带逐句字幕、竖排人物介绍、知识动画与片尾卡的可发布成片。支持医学
  科普、产品介绍、电商分析、切片剪辑等场景；可按时间码或去静音剪精华并自动重映射字幕时间轴；分
  镜统一排版、全片固定色调，也可切换八种分格；动画支持 Pillow / Remotion /
  外部逐帧。Use when 用户提供素材或参考成片，或要求加字幕、人物名片、知识动画、片尾包
  装、数据图表，或要求切片剪辑、去静音、提取精彩片段、切换分镜。
